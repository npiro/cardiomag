# Atrial (P-wave) anomalies on the four biatrial patient models, PTB 49-channel SQUID layout.
name: atrial_ptb49
kind: atria
seed: 1
array: {preset: ptb49, standoff_mm: 45}
placements_per_heart: 4
placement_jitter: {centre_mm: 25, standoff_mm: 12, rotation_deg: 10, heart_rot_deg: 12}   # broad: real geometry is unknown
time: {t0_ms: -40, t1_ms: 240, dt_ms: 2}        # long window; the acquisition model aligns + crops
samples_per_heart: {healthy: 240, slow_patch: 80, ia_block: 80, ectopic: 80}
splits:                                         # split by heart: no anatomy in two splits
  train: [biatrial:S1, biatrial:S2]
  val: [biatrial:S3]
  test: [biatrial:S4]
